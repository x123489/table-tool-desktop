name: Build Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle 8.7
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -OutFile "$env:TEMP\gradle.zip"
          Expand-Archive -Path "$env:TEMP\gradle.zip" -DestinationPath "C:\gradle"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\gradle\gradle-8.7\bin"
      - name: Install WiX (required for MSI)
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wix) { Add-Content -Path $env:GITHUB_PATH -Value $wix }
      - name: Build package
        run: gradle package --no-daemon
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/compose/binaries/main/msi/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build package
        run: gradle package --no-daemon
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/compose/binaries/main/deb/*
