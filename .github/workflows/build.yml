name: Build Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Gradle 8.7
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -OutFile "$env:TEMP\gradle.zip"
          Expand-Archive -Path "$env:TEMP\gradle.zip" -DestinationPath "C:\gradle"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\gradle\gradle-8.7\bin"
      - name: Build portable distribution
        run: gradle createDistributable --no-daemon --stacktrace
      - name: Dump jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== createDistributable.args.txt ==="
          Get-Content build/compose/tmp/createDistributable.args.txt -ErrorAction SilentlyContinue
          Write-Host "=== logs dir ==="
          Get-ChildItem build/compose/logs -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -ErrorAction SilentlyContinue }
      - name: Zip Windows artifact
        shell: pwsh
        run: |
          $src = "build/compose/binaries/main/app"
          Compress-Archive -Path "$src/*" -DestinationPath "build/table-tool-windows.zip" -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/table-tool-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build package
        run: gradle package --no-daemon
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/compose/binaries/main/deb/*
