name: Build Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Gradle 8.7
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -OutFile "$env:TEMP\gradle.zip"
          Expand-Archive -Path "$env:TEMP\gradle.zip" -DestinationPath "C:\gradle"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\gradle\gradle-8.7\bin"
      - name: Build portable distribution
        run: gradle createDistributable --no-daemon --stacktrace
      - name: Dump jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== createDistributable.args.txt ==="
          Get-Content build/compose/tmp/createDistributable.args.txt -ErrorAction SilentlyContinue
          Write-Host "=== logs dir ==="
          Get-ChildItem build/compose/logs -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -ErrorAction SilentlyContinue }
      - name: Prepare portable artifacts (zip + single-file EXE)
        shell: pwsh
        run: |
          $src = "build/compose/binaries/main/app"
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null
          # 1) 普通便携 zip（解压即用，含内嵌 JRE）
          Compress-Archive -Path "$src/*" -DestinationPath "build/dist/table-tool-windows.zip" -Force
          # 2) 单文件自解压 EXE（双击即用，免安装）
          try {
            $7z = "$env:ProgramFiles\7-Zip\7z.exe"
            $stub = "$env:ProgramFiles\7-Zip\7zS.sfx"
            if (-not ((Test-Path $7z) -and (Test-Path $stub))) {
              choco install 7zip -y | Out-Null
              $7z = "$env:ProgramFiles\7-Zip\7z.exe"
              $stub = "$env:ProgramFiles\7-Zip\7zS.sfx"
            }
            if ((Test-Path $7z) -and (Test-Path $stub)) {
              & $7z a -t7z -mx=5 build/table-tool.7z "build/compose/binaries/main/app/table-tool"
              $config = ';!@Install@!UTF-8!' + [Environment]::NewLine + 'Title="TableTool"' + [Environment]::NewLine + 'ExtractDialog=0' + [Environment]::NewLine + 'OverwriteMode=1' + [Environment]::NewLine + 'InstallPath="%TEMP%\table-tool-portable"' + [Environment]::NewLine + 'RunProgram="table-tool\table-tool.exe"' + [Environment]::NewLine + ';!@InstallEnd@!'
              [System.IO.File]::WriteAllText("build/sfx_config.txt", $config, [System.Text.UTF8Encoding]::new($true))
              $bytes = [System.IO.File]::ReadAllBytes($stub) + [System.IO.File]::ReadAllBytes("build/sfx_config.txt") + [System.IO.File]::ReadAllBytes("build/table-tool.7z")
              [System.IO.File]::WriteAllBytes("build/dist/table-tool-portable.exe", $bytes)
              Write-Host "SFX EXE 构建成功"
            } else {
              Write-Host "7z 不可用，跳过单文件 EXE（zip 仍可用）"
            }
          } catch {
            Write-Host "单文件 EXE 构建失败，但不影响 zip 交付：$_"
          }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build package
        run: gradle package --no-daemon
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/compose/binaries/main/deb/*
